name: Deploy to Test Environment

on:
  push:
    branches: [ dev ]

permissions:
  contents: write

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v2
      with:
        python-version: 3.9
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        
    - name: Run integration tests
      run: |
        pytest tests/ -v --cov=utils --cov-report=xml -m "not unit"
        
    - name: Deploy to test environment
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Clean workspace
        git clean -fd
        git reset --hard HEAD
        
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # Configure git to use the token
        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
        
        # Store current dev branch content
        cp -r . /tmp/dev_content/
        
        # Switch to tst and merge dev with strategy-option theirs
        git fetch origin tst
        git checkout tst
        git merge --no-ff --allow-unrelated-histories -X theirs dev -m "Merge dev into tst: Deploy code updates"
        
        # If merge failed, force update files from dev
        if [ $? -ne 0 ]; then
          echo "Merge failed, forcing update with dev content..."
          cp -rf /tmp/dev_content/* .
          git add .
          git commit -m "Force update tst with dev content"
        fi
        
        git push origin tst