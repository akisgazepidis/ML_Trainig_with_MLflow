name: Deploy MLflow Model

on:
  push:
    branches: [ dev ]

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v2
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v2
      with:
        python-version: 3.9
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        
    - name: Run integration tests
      run: |
        pytest tests/ -v --cov=utils --cov-report=xml -m "not unit"
        
    - name: Train and validate model
      run: |
        python main.py
        
    - name: Check model performance
      run: |
        python -c "
        import mlflow
        runs = mlflow.search_runs()
        latest_run = runs.iloc[0]
        mse = latest_run['metrics.mse']
        assert mse < 4000, f'Model performance below threshold: MSE = {mse}'
        "
        
    - name: Deploy model to test environment
      run: |
        # Clean workspace
        git clean -fd
        git reset --hard HEAD
        
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git fetch origin tst
        git checkout tst
        git merge --no-ff dev -m "Merge dev into tst: Deploy model updates"
        
        # Register new model version in MLflow
        python -c "
        import mlflow
        from mlflow.tracking import MlflowClient
        
        client = MlflowClient()
        runs = mlflow.search_runs()
        latest_run = runs.iloc[0]
        
        model_uri = f'runs:/{latest_run.run_id}/model'
        client.create_model_version(
            name='diabetes-model',
            source=model_uri,
            run_id=latest_run.run_id
        )
        "
        
        git push origin tst